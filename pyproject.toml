[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantpilot"
version = "1.0.0rc2"
description = "Trade Companion AI-assisted trade lifecycle research workspace"
requires-python = ">=3.9,<3.10"
dependencies = [
  "fastapi>=0.115,<0.129",
  "uvicorn[standard]>=0.30,<0.40",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<1.17",
  "pydantic-settings>=2.4,<2.12",
  "httpx>=0.27,<0.29",
  "moomoo-api>=9.2,<10",
  "pandas>=2.0,<2.4",
  "numpy>=1.24,<2.1",
  "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<8.5", "pytest-asyncio>=0.23,<0.27"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "live_moomoo: requires a manually logged-in local OpenD and performs read-only quote calls",
]
