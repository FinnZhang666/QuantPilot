version: qmr-backtest-v1
strategy_version: QMR-v1.0
source_buy_score_version: buy-score-v1
timeframe: 1d
holding_periods: [1, 3, 5, 10, 20]
entry_levels: [EARLY_ENTRY, CONFIRMED_ENTRY, STRONG_ENTRY]
local_bottom_window_days: 5
targets_pct: [5, 7.5, 10, 12.5, 15, 20]
stops_pct: [3, 5, 7, 10]
trailing_stops_pct: [5, 7, 8, 10, 12, 15]
same_bar_policy: STOP_FIRST
minimum_formal_sample: 30
walk_forward:
  minimum_training_years: 2
  test_years: 1
validation:
  minimum_profit_factor: 1.0
  require_positive_out_of_sample: true
  minimum_samples: 100

